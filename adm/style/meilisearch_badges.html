<!--
	Shared badge bar, included at the top of every ACP page of this extension.

	Inline styles rather than a stylesheet: the ACP loads no extension CSS by
	default, and adding a file for one strip of badges is not worth the extra
	request. Classes are namespaced under .meili-badges so nothing can collide.
-->
<div class="meili-badges" style="display:flex; flex-wrap:wrap; gap:6px; margin:0 0 12px 0; font-size:13px; line-height:1.4;">
	<span style="display:inline-flex; border-radius:4px; overflow:hidden; font-family:Verdana,Arial,sans-serif;">
		<span style="background:#5F6A72; color:#fff; padding:4px 9px;">{L_MEILI_BADGE_VERSION}</span>
		<span style="background:#2A6BB0; color:#fff; padding:4px 9px; font-weight:bold;">{MEILI_BADGE_VERSION}</span>
	</span>
	<span style="display:inline-flex; border-radius:4px; overflow:hidden; font-family:Verdana,Arial,sans-serif;">
		<span style="background:#5F6A72; color:#fff; padding:4px 9px;">phpBB</span>
		<span style="background:#3B8C3B; color:#fff; padding:4px 9px; font-weight:bold;">{MEILI_BADGE_PHPBB}</span>
	</span>
	<span style="display:inline-flex; border-radius:4px; overflow:hidden; font-family:Verdana,Arial,sans-serif;">
		<span style="background:#5F6A72; color:#fff; padding:4px 9px;">PHP</span>
		<span style="background:#3B8C3B; color:#fff; padding:4px 9px; font-weight:bold;">{MEILI_BADGE_PHP}</span>
	</span>
	<span style="display:inline-flex; border-radius:4px; overflow:hidden; font-family:Verdana,Arial,sans-serif;">
		<span style="background:#5F6A72; color:#fff; padding:4px 9px;">{L_MEILI_BADGE_LICENSE}</span>
		<span style="background:#6E6E6E; color:#fff; padding:4px 9px; font-weight:bold;">{MEILI_BADGE_LICENSE}</span>
	</span>
</div>
